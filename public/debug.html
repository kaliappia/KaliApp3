<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Variables d'Environnement</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1f2937;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #374151;
            padding: 30px;
            border-radius: 15px;
        }
        h1 {
            color: #10b981;
            margin-top: 0;
        }
        .check {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #10b981;
        }
        .error {
            border-left-color: #ef4444;
        }
        .success {
            border-left-color: #10b981;
        }
        .warning {
            border-left-color: #f59e0b;
        }
        code {
            background: #1f2937;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #60a5fa;
        }
        .value {
            color: #a78bfa;
            word-break: break-all;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug - Variables d'Environnement</h1>

        <div id="results"></div>

        <button onclick="location.reload()">🔄 Rafraîchir</button>
        <button onclick="location.href='/'">← Retour à l'App</button>
    </div>

    <script>
        const results = document.getElementById('results');

        // Cette fonction simule la vérification côté client
        // Les vraies variables sont injectées au build par Vite
        function checkEnvironment() {
            let html = '';

            // Check si les variables sont définies
            // Note: En production, import.meta.env n'est pas accessible directement
            // donc on vérifie via le pattern de l'app

            html += '<div class="check">';
            html += '<h3>ℹ️ Information Importante</h3>';
            html += '<p>Les variables d\'environnement sont injectées au <strong>moment du build</strong> par Vite.</p>';
            html += '<p>Si vous venez de les ajouter sur Vercel, vous DEVEZ redéployer pour qu\'elles soient prises en compte.</p>';
            html += '</div>';

            html += '<div class="check">';
            html += '<h3>📋 Checklist</h3>';
            html += '<ol>';
            html += '<li>Variables ajoutées sur Vercel : Settings → Environment Variables</li>';
            html += '<li>Nom exact : <code>VITE_SUPABASE_URL</code> et <code>VITE_SUPABASE_ANON_KEY</code></li>';
            html += '<li>Les 3 environnements cochés (Production, Preview, Development)</li>';
            html += '<li><strong>REDÉPLOYÉ</strong> depuis Deployments → ... → Redeploy</li>';
            html += '<li>Attendu 2-3 minutes après le redéploiement</li>';
            html += '</ol>';
            html += '</div>';

            html += '<div class="check warning">';
            html += '<h3>⚠️ Si l\'app affiche toujours "Configuration Supabase Requise"</h3>';
            html += '<p>Cela signifie que les variables ne sont PAS chargées. Vérifiez :</p>';
            html += '<ul>';
            html += '<li>Le nom des variables commence bien par <code>VITE_</code> (en majuscules)</li>';
            html += '<li>Pas d\'espaces avant/après le nom ou la valeur</li>';
            html += '<li>Vous avez bien cliqué sur "Save" sur Vercel</li>';
            html += '<li>Vous avez REDÉPLOYÉ après avoir ajouté les variables</li>';
            html += '</ul>';
            html += '</div>';

            html += '<div class="check">';
            html += '<h3>🔑 Format Attendu</h3>';
            html += '<p><strong>VITE_SUPABASE_URL</strong> doit ressembler à :</p>';
            html += '<code>https://xxxxxxxxxx.supabase.co</code>';
            html += '<p style="margin-top: 15px;"><strong>VITE_SUPABASE_ANON_KEY</strong> doit ressembler à :</p>';
            html += '<code>eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</code> (très longue clé)';
            html += '</div>';

            html += '<div class="check success">';
            html += '<h3>✅ Prochaine Étape</h3>';
            html += '<p>1. Vérifiez les points ci-dessus sur Vercel</p>';
            html += '<p>2. Si tout est OK, redéployez UNE DERNIÈRE FOIS</p>';
            html += '<p>3. Attendez 3 minutes</p>';
            html += '<p>4. Rafraîchissez l\'app principale</p>';
            html += '</div>';

            results.innerHTML = html;
        }

        checkEnvironment();
    </script>
</body>
</html>
