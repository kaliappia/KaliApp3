<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="metamask-auto-connect" content="false" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSocial Calendar" />
    <link rel="apple-touch-icon" href="/vite.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Application sociale de gestion d'événements" />

    <title>DSocial Calendar</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Debug Script - Capture errors before React loads -->
    <script>
      // Show loading indicator
      const root = document.getElementById('root');
      root.innerHTML = `
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: sans-serif;">
          <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; text-align: center;">
            <h1 style="margin: 0 0 20px 0; color: #1f2937;">⏳ Chargement...</h1>
            <p style="color: #6b7280; margin: 0;">L'application se charge</p>
            <div id="debug-info" style="margin-top: 20px; text-align: left; background: #f3f4f6; padding: 15px; border-radius: 8px; font-size: 12px; font-family: monospace;"></div>
          </div>
        </div>
      `;

      const debugInfo = document.getElementById('debug-info');

      function log(message, isError = false) {
        const p = document.createElement('p');
        p.style.margin = '5px 0';
        p.style.color = isError ? '#dc2626' : '#059669';
        p.textContent = (isError ? '❌ ' : '✓ ') + message;
        debugInfo.appendChild(p);
      }

      log('HTML chargé');
      log('Root element trouvé');

      // Capture all errors
      window.addEventListener('error', function(event) {
        log('ERREUR: ' + event.message, true);
        log('Fichier: ' + event.filename, true);
        log('Ligne: ' + event.lineno, true);

        root.innerHTML = `
          <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #dc2626; font-family: monospace; color: white; padding: 20px;">
            <div style="background: #1f2937; padding: 30px; border-radius: 15px; max-width: 800px; width: 100%;">
              <h1 style="color: #fca5a5; margin-top: 0;">❌ Erreur JavaScript</h1>
              <div style="background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px; overflow: auto;">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: #fbbf24;">Message:</p>
                <pre style="margin: 0; white-space: pre-wrap; color: #fca5a5;">${event.message}</pre>
              </div>
              <div style="background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: #fbbf24;">Fichier:</p>
                <pre style="margin: 0; white-space: pre-wrap; color: #d1d5db;">${event.filename}</pre>
              </div>
              <div style="background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: #fbbf24;">Ligne:</p>
                <pre style="margin: 0; white-space: pre-wrap; color: #d1d5db;">${event.lineno}:${event.colno}</pre>
              </div>
              ${event.error && event.error.stack ? `
                <div style="background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px; overflow: auto;">
                  <p style="margin: 0 0 10px 0; font-weight: bold; color: #fbbf24;">Stack:</p>
                  <pre style="margin: 0; white-space: pre-wrap; font-size: 11px; color: #d1d5db;">${event.error.stack}</pre>
                </div>
              ` : ''}
              <button onclick="location.href='/test.html'" style="background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin-right: 10px;">🧪 Page de Test</button>
              <button onclick="location.reload()" style="background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer;">🔄 Rafraîchir</button>
            </div>
          </div>
        `;
        return false;
      });

      window.addEventListener('unhandledrejection', function(event) {
        log('ERREUR PROMISE: ' + event.reason, true);
      });

      log('Listeners d\'erreur installés');
      log('Chargement de main.tsx...');
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <!-- <script src="https://api.tempo.build/proxy-asset?url=https://storage.googleapis.com/tempo-public-assets/error-handling.js"></script> [deprecated] -->
  </body>
</html>
